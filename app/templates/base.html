<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tolga Ustunkok{% endblock %}</title>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="/static/js/fingerprint.js"></script>
    {% block pre_analytics %}{% endblock %}
    <script src="/static/js/analytics.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script defer>
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
        mermaid.run();
    </script>
    <style>
        .prose > p, .editor-preview > p { margin-top: 1.25em; margin-bottom: 1.25em; }
        .prose > p:first-child, .editor-preview > p:first-child { margin-top: 0; }
        .prose > p:last-child, .editor-preview > p:last-child { margin-bottom: 0; }
        .prose h1, .editor-preview h1 { font-size: 2.25em; margin-top: 0; margin-bottom: 0.8888889em; line-height: 1.1111111; }
        .prose h2, .editor-preview h2 { font-size: 1.5em; margin-top: 2em; margin-bottom: 1em; line-height: 1.3333333; }
        .prose h3, .editor-preview h3 { font-size: 1.25em; margin-top: 1.6em; margin-bottom: 0.6em; line-height: 1.6; }
        .prose h4, .editor-preview h4 { margin-top: 1.5em; margin-bottom: 0.5em; line-height: 1.5; }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6, .editor-preview h1, .editor-preview h2, .editor-preview h3, .editor-preview h4, .editor-preview h5, .editor-preview h6 { font-weight: 600; }
        .prose ul, .prose ol, .editor-preview ul, .editor-preview ol { margin-top: 1.25em; margin-bottom: 1.25em; padding-left: 1.625em; }
        .prose ul, .editor-preview ul { list-style-type: disc; }
        .prose ol, .editor-preview ol { list-style-type: decimal; }
        .prose li, .editor-preview li { margin-top: 0.5em; margin-bottom: 0.5em; }
        .prose blockquote, .editor-preview blockquote { font-weight: 500; font-style: italic; color: inherit; border-left: 0.25rem solid; border-color: #d1d5db; padding-left: 1rem; margin-top: 1.6em; margin-bottom: 1.6em; }
        .dark .prose blockquote, .dark .editor-preview blockquote { border-color: #374151; }
        .prose a, .editor-preview a { color: currentColor; text-decoration: underline; }
        .prose strong, .editor-preview strong { font-weight: 600; }
        .prose code, .editor-preview code { font-family: ui-monospace, monospace; font-size: 0.875em; background: #f3f4f6; padding: 0.125em 0.25em; border-radius: 0.25rem; }
        .dark .prose code, .dark .editor-preview code { background: #1f2937; }
        .prose pre, .editor-preview pre { margin-top: 1.6em; margin-bottom: 1.6em; }
        .prose img, .editor-preview img { margin-top: 2em; margin-bottom: 2em; }
        .prose hr, .editor-preview hr { margin-top: 3em; margin-bottom: 3em; border: 0; border-top: 1px solid #d1d5db; }
        .dark .prose hr, .dark .editor-preview hr { border-color: #374151; }
        .prose table, .editor-preview table { width: 100%; table-layout: auto; text-align: left; margin-top: 2em; margin-bottom: 2em; }
        .prose thead, .editor-preview thead { border-bottom: 1px solid #d1d5db; }
        .dark .prose thead, .dark .editor-preview thead { border-color: #374151; }
        .prose thead th, .editor-preview thead th { font-weight: 600; vertical-align: bottom; padding: 0 0.5714286em 0.5714286em 0; }
        .prose tbody tr, .editor-preview tbody tr { border-bottom: 1px solid #e5e7eb; }
        .dark .prose tbody tr, .dark .editor-preview tbody tr { border-color: #1f2937; }
        .prose tbody td, .editor-preview tbody td { vertical-align: baseline; padding: 0.5714286em 0.5714286em 0.5714286em 0; }
        pre code .line-number { user-select: none; -webkit-user-select: none; color: #8b949e; display: inline-block; min-width: 2ch; text-align: right; margin-right: 1em; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100">
    <header class="border-b border-gray-200 dark:border-gray-800">
        <nav class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-lg font-bold">Tolga Ustunkok</a>
            <div class="flex items-center gap-4">
                <a href="/" class="text-sm hover:underline">Home</a>
                <a href="/archive" class="text-sm hover:underline">Archive</a>
                <a href="/tags" class="text-sm hover:underline">Tags</a>
                <a href="/about" class="text-sm hover:underline">About</a>
                <a href="/now" class="text-sm hover:underline">Now</a>
                <form action="/search" method="get" class="flex items-center">
                    <input type="search" name="q" placeholder="Search..." class="text-sm px-2 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 w-32 focus:w-48 transition-all focus:outline-none focus:border-gray-500">
                </form>
                <button id="theme-toggle" class="text-sm p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-800" aria-label="Toggle dark mode">
                    <span class="dark:hidden">&#9789;</span>
                    <span class="hidden dark:inline">&#9788;</span>
                </button>
            </div>
        </nav>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-gray-200 dark:border-gray-800 mt-auto">
        <div class="max-w-4xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
            Tolga Ustunkok &middot; <a href="/feed.xml" class="hover:underline">RSS</a>
        </div>
    </footer>
    <script>
        document.getElementById('theme-toggle').addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
