{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.css">
<style>
    .editor-preview p { margin-top: 1.25em; margin-bottom: 1.25em; }
    .editor-preview p:first-child { margin-top: 0; }
    .editor-preview p:last-child { margin-bottom: 0; }
</style>
{% endblock %}
{% block title %}{{ title }} - Tolga Ustunkok (Admin){% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
<form method="post" class="space-y-4">
    <textarea name="content" id="page-content-editor" rows="20"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded bg-white dark:bg-gray-900 font-mono">{{ content }}</textarea>
    <div class="flex gap-2">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">Save</button>
        <a href="/admin" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded text-sm hover:bg-gray-100 dark:hover:bg-gray-800">Cancel</a>
    </div>
</form>
<script src="https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.js"></script>
<script src="/static/js/easymde-setup.js"></script>
<script>
    createEasyMDE('page-content-editor');
</script>
{% endblock %}
