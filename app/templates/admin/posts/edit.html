{% extends "base.html" %}
{% block title %}{% if post %}Edit{% else %}New{% endif %} Post - Tolga Ustunkok{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{% if post %}Edit{% else %}New{% endif %} Post</h1>
<form method="post" action="{% if post %}/admin/posts/{{ post.id }}{% else %}/admin/posts{% endif %}" class="space-y-4 max-w-2xl">
    <div>
        <label class="block text-sm font-medium mb-1">Title</label>
        <input type="text" name="title" value="{{ post.title if post else '' }}" required
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded bg-white dark:bg-gray-900">
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Slug</label>
        <input type="text" name="slug" value="{{ post.slug if post else '' }}"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded bg-white dark:bg-gray-900">
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Excerpt</label>
        <textarea name="excerpt" rows="2"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded bg-white dark:bg-gray-900">{{ post.excerpt if post else '' }}</textarea>
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Body (Markdown)</label>
        <textarea name="body" rows="20"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded bg-white dark:bg-gray-900 font-mono">{{ post.body if post else '' }}</textarea>
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Publish At (optional, leave empty for draft)</label>
        <input type="text" name="publish_at"
            value="{{ post.publish_at.isoformat() if post and post.publish_at else '' }}"
            placeholder="2026-12-31T12:00:00"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded bg-white dark:bg-gray-900">
    </div>
    <div class="flex gap-3">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
        <a href="/admin/posts" class="px-4 py-2 border border-gray-300 dark:border-gray-700 rounded hover:bg-gray-50 dark:hover:bg-gray-900">Cancel</a>
    </div>
</form>
{% endblock %}
